; ---------------------------------------------------------------------------
; JIRA configuration template
;
; Copy this file to "jira_config.ini" and fill in the values below.
; jira_config.ini is git-ignored so your credentials are never committed.
;
;   cp jira_config.example.ini jira_config.ini
; ---------------------------------------------------------------------------

[JIRA]
; Base URL of your Atlassian/JIRA instance (no trailing slash)
; Example: https://your-company.atlassian.net
url =

; JIRA account email used for API authentication
; Example: you@your-company.com
username =

; JIRA API token. Generate one at:
; https://id.atlassian.com/manage-profile/security/api-tokens
api_token =

[Settings]
; Directory where downloaded build archives are saved.
; Relative paths are resolved from the project root.
download_directory = ./archives
